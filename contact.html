<div class="bg-black text-white px-[45px] py-[60px]">

        <div class="text-[35px] font-bold">
            Contact <span class="text-yellow-500">Me</span>
        </div>

            Let's connect and build something amazing together 🚀
        </div>
    </div>

 
    <form class="max-w-[600px] mx-auto flex flex-col gap-[20px]">


        <input 
            type="text" 
            placeholder="Your Name"
            class="bg-[#111] border border-gray-700 p-[12px] rounded-[5px] focus:outline-none focus:border-yellow-500"
        >

       
        <input 
            type="email" 
            placeholder="Your Email"
            class="bg-[#111] border border-gray-700 p-[12px] rounded-[5px] focus:outline-none focus:border-yellow-500"
        >

    
        <input 
            type="text" 
            placeholder="Subject"
            class="bg-[#111] border border-gray-700 p-[12px] rounded-[5px] focus:outline-none focus:border-yellow-500"
        >

     
        <textarea 
            rows="5"
            placeholder="Your Message"
            class="bg-[#111] border border-gray-700 p-[12px] rounded-[5px] focus:outline-none focus:border-yellow-500 resize-none"
        ></textarea>

   
        <button 
            type="submit"
            class="bg-purple-500 hover:bg-yellow-500 transition duration-300 p-[12px] rounded-[5px] text-white font-semibold bounce"
        >
            Send Message
        </button>

    </form>
